name: Deploy prototype

# Publishes the playable build to GitHub Pages.
#
# Automatic on main and on the claude/* working branches, so a change pushed
# from a Claude session is live on the public URL a couple of minutes later with
# nothing to click. Also runnable by hand from any branch via the Actions tab.
#
# NOTE: deploying from a non-default branch requires the github-pages
# environment to allow it, once:
#   Settings -> Environments -> github-pages -> Deployment branches
#   -> "No restriction" (or add claude/*)
# Without that, a branch deploy fails with "Branch is not allowed to deploy to
# github-pages due to environment protection rules." Deploys from main always
# work.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vite build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
