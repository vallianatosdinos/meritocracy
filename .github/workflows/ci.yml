name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine tests
        run: npm test

      # The one that matters: simulates thousands of lives and fails the build
      # if a path drifts outside its design bands. A path that gives the player
      # too much free will is a broken build, not a matter of taste.
      - name: Validate life paths
        run: npm run validate

      - name: Build
        run: npx vite build
